services:
  mongodb:
    image: mongo:5.0
    container_name: cropchain_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: cropchain_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/auth_db
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: cropchain_client
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend

  ml_api:
    build: ./crop_recommendation
    container_name: cropchain_ml_api
    ports:
      - "5001:5001"

volumes:
  mongo_data:
